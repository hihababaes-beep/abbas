<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عباس أحمد حاتم</title>
<style>
  :root{
    --acc:#2dd4bf; --acc2:#99f6e4; --bg1:#03100e; --bg2:#0a2824;
    --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.14); --txt:#eefffb; --mut:#8fb5ae;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:10px 8px;
    font-family:'Segoe UI',Tahoma,'Noto Naskh Arabic',Arial,sans-serif; color:var(--txt);
    background:radial-gradient(circle at 15% 10%,#0f4a42 0%,transparent 45%),
               radial-gradient(circle at 85% 90%,#0c3a52 0%,transparent 42%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
    overflow-x:hidden;
  }
  .bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bg i{position:absolute;bottom:-20px;width:6px;height:6px;border-radius:50%;
    background:var(--acc);opacity:0;animation:rise linear infinite;filter:blur(.5px)}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}10%{opacity:.7}100%{transform:translateY(-110vh) scale(1.4);opacity:0}}

  @property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
  .wrap{position:relative;z-index:1;width:100%;max-width:400px;transition:transform .15s ease-out;will-change:transform}
  .wrap::before,.wrap::after{
    content:"";position:absolute;inset:-2px;border-radius:30px;padding:2px;pointer-events:none;z-index:3;
    background:conic-gradient(from var(--a),transparent 0%,var(--acc) 12%,transparent 28%,#22d3ee 50%,transparent 66%,var(--acc2) 84%,transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;animation:spin 4s linear infinite;
  }
  .wrap::after{filter:blur(10px);opacity:.8;inset:-4px;padding:4px;border-radius:32px}
  @keyframes spin{to{--a:360deg}}

  .card{
    position:relative; padding:30px 22px 26px; border-radius:28px;
    background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    border:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.15);
    animation:cardIn .9s cubic-bezier(.2,.9,.3,1.1) both; overflow:hidden;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(50px) scale(.94)}to{opacity:1;transform:none}}
  .card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent);
    transform:skewX(-20deg);animation:shine 5s ease-in-out 1.2s infinite;pointer-events:none}
  @keyframes shine{0%{left:-60%}35%,100%{left:140%}}

  .ctitle{width:max-content;margin:0 auto 16px;padding:8px 22px;border-radius:99px;font-size:16px;font-weight:700;
    color:var(--acc2);border:1px solid rgba(45,212,191,.45);background:rgba(45,212,191,.09);
    box-shadow:0 0 18px rgba(45,212,191,.28);
    animation:pop .8s .3s cubic-bezier(.2,1.4,.4,1) both, float 4s ease-in-out 1.2s infinite}
  @keyframes pop{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  h1{text-align:center;font-size:27px;font-weight:800;
    background:linear-gradient(90deg,#fff,var(--acc2),#fff);background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:fade .7s .5s both, grad 4s linear infinite, glow 3s ease-in-out infinite}
  @keyframes grad{to{background-position:200% center}}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(45,212,191,.2))}50%{filter:drop-shadow(0 0 16px rgba(45,212,191,.7))}}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .sec{margin-top:26px;font-size:12px;color:var(--mut);letter-spacing:.5px;display:flex;align-items:center;gap:10px;
    animation:fade .7s .95s both}
  .sec::after{content:"";flex:1;height:1px;background:var(--line)}

  .phone{margin-top:12px;text-align:center;font-size:25px;font-weight:700;letter-spacing:2px;direction:ltr;
    animation:fade .7s 1s both}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 10px;border-radius:16px;
    text-decoration:none;color:#fff;font-weight:700;font-size:15px;border:0;cursor:pointer;font-family:inherit;
    transition:transform .2s, box-shadow .2s; animation:fade .7s 1.1s both; position:relative;overflow:hidden
  }
  .btn:active{transform:scale(.95)}
  .btn:hover{transform:translateY(-3px)}
  .call{background:linear-gradient(135deg,#0ea5e9,#0369a1);box-shadow:0 8px 22px rgba(14,165,233,.4)}
  .wa{background:linear-gradient(135deg,#25d366,#0e9f4b);box-shadow:0 8px 22px rgba(37,211,102,.4);
    animation:fade .7s 1.1s both, bump 2.4s ease-in-out 2s infinite}
  @keyframes bump{0%,100%{box-shadow:0 8px 22px rgba(37,211,102,.4)}50%{box-shadow:0 8px 34px rgba(37,211,102,.85)}}
  .btn svg{width:22px;height:22px;fill:#fff}
  .call svg{animation:ring 2s ease-in-out infinite;transform-origin:center}
  @keyframes ring{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-18deg)}75%{transform:rotate(16deg)}85%{transform:rotate(-12deg)}95%{transform:rotate(8deg)}}
  .btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:btnShine 3.5s ease-in-out infinite}
  @keyframes btnShine{0%{left:-80%}50%,100%{left:160%}}

  .socials{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .soc{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:16px;text-decoration:none;color:var(--txt);
    background:var(--glass);border:1px solid var(--line);transition:.25s;animation:fade .7s 1.25s both;min-width:0}
  .soc:hover{transform:translateY(-4px);border-color:var(--acc)}
  .soc:hover .ic{animation:wiggle .5s}
  @keyframes wiggle{25%{transform:rotate(-14deg) scale(1.1)}75%{transform:rotate(14deg) scale(1.1)}}
  .soc .ic{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .soc svg{width:21px;height:21px;fill:#fff}
  .ig .ic{background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)}
  .fb .ic{background:linear-gradient(135deg,#1e90ff,#1250c4)}
  .soc b{display:block;font-size:14px}
  .soc small{display:block;color:var(--mut);font-size:11px;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;z-index:0}
  .o1{width:300px;height:300px;background:#14b8a6;top:-80px;right:-80px;animation:drift1 14s ease-in-out infinite alternate}
  .o2{width:260px;height:260px;background:#0ea5e9;bottom:-60px;left:-70px;animation:drift2 17s ease-in-out infinite alternate}
  .o3{width:200px;height:200px;background:#84cc16;top:45%;left:55%;opacity:.15;animation:drift1 20s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate(-90px,120px) scale(1.25)}}
  @keyframes drift2{to{transform:translate(110px,-100px) scale(1.2)}}

  .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
  @keyframes ripple{to{transform:scale(1);opacity:0}}
  .sp{position:fixed;width:8px;height:8px;pointer-events:none;z-index:99;border-radius:50%;
    animation:spark .8s ease-out forwards;box-shadow:0 0 10px currentColor;background:currentColor}
  @keyframes spark{to{transform:translate(var(--dx,0),var(--dy,-40px)) scale(0);opacity:0}}

  @media (prefers-reduced-motion:reduce){*,*::after,*::before{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="bg" id="bg"></div>

<div class="wrap">
  <div class="card">
    <div class="ctitle">معلومات اتصال</div>
    <h1>عباس أحمد حاتم</h1>

    <div class="sec">التواصل</div>
    <div class="phone">0782 582 8747</div>
    <div class="btns">
      <a class="btn call" id="callBtn" href="tel:07825828747">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.25c1.1.37 2.3.57 3.6.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1z"/></svg>
        اتصال
      </a>
      <a class="btn wa" id="waBtn" href="https://wa.me/qr/O5BP6GYJUJ5QF1">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.800-1.200-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .6l-.4.600-.3.400c-.1.100-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.200 1 2.200 1.400 2.500 1.500.3.100.5.100.7-.1l.9-1.100c.2-.3.4-.2.7-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400z"/></svg>
        واتساب
      </a>
    </div>

    <div class="sec">السوشيال ميديا</div>
    <div class="socials">
      <a class="soc ig" href="https://www.instagram.com/abs6u?mdxt=MTJpZmhwdnYzOTVlMA==" target="_blank" rel="noopener">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 015 5v10a5 5 0 01-5 5H7a5 5 0 01-5-5V7a5 5 0 015-5zm0 2a3 3 0 00-3 3v10a3 3 0 003 3h10a3 3 0 003-3V7a3 3 0 00-3-3H7zm5 3.500A4.500 4.500 0 1112 16.500 4.500 4.500 0 0112 7.500zm0 2A2.500 2.500 0 1012 14.500 2.500 2.500 0 0012 9.500zM17.500 6a1 1 0 110 2 1 1 0 010-2z"/></svg></span>
        <span style="min-width:0"><b>انستغرام</b><small>@abs6u</small></span>
      </a>
      <a class="soc fb" href="https://www.facebook.com/share/1FKVawPGrL/" target="_blank" rel="noopener">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 10-11.600 9.900v-7H7.900V12h2.500V9.800c0-2.500 1.500-3.900 3.800-3.900 1.100 0 2.200.2 2.200.2v2.500h-1.300c-1.200 0-1.600.8-1.600 1.600V12h2.800l-.4 2.900h-2.300v7A10 10 0 0022 12z"/></svg></span>
        <span style="min-width:0"><b>فيسبوك</b><small>Abbas Ahmed</small></span>
      </a>
    </div>
  </div>
</div>

<script>
  // جزيئات الخلفية
  const bg=document.getElementById('bg');
  for(let i=0;i<26;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(7+Math.random()*9)+'s';
    p.style.animationDelay=(-Math.random()*12)+'s';
    p.style.width=p.style.height=(3+Math.random()*5)+'px';
    bg.appendChild(p);
  }

  // ميلان ثلاثي الأبعاد
  const card=document.querySelector('.wrap');
  function tilt(x,y){
    const r=card.getBoundingClientRect();
    const dx=(x-(r.left+r.width/2))/r.width, dy=(y-(r.top+r.height/2))/r.height;
    card.style.transform=`perspective(900px) rotateY(${dx*12}deg) rotateX(${-dy*12}deg)`;
  }
  window.addEventListener('mousemove',e=>tilt(e.clientX,e.clientY));
  window.addEventListener('touchmove',e=>{const t=e.touches[0];tilt(t.clientX,t.clientY)},{passive:true});
  window.addEventListener('mouseleave',()=>card.style.transform='');
  window.addEventListener('touchend',()=>card.style.transform='');

  // شرارات
  const COLORS=['#2dd4bf','#99f6e4','#22d3ee','#25d366','#1877f2','#fff'];
  function spark(x,y,dx,dy){
    const s=document.createElement('span');s.className='sp';
    s.style.left=x+'px';s.style.top=y+'px';s.style.color=COLORS[Math.floor(Math.random()*COLORS.length)];
    s.style.setProperty('--dx',dx+'px');s.style.setProperty('--dy',dy+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),800);
  }
  function burst(x,y){
    for(let i=0;i<16;i++){
      const a=Math.PI*2*i/16, d=40+Math.random()*50;
      spark(x,y,Math.cos(a)*d,Math.sin(a)*d);
    }
  }
  let lastSp=0;
  window.addEventListener('pointermove',e=>{
    const n=Date.now(); if(n-lastSp<45) return; lastSp=n;
    spark(e.clientX,e.clientY,(Math.random()-.5)*40,20+Math.random()*30);
  });
  window.addEventListener('pointerdown',e=>burst(e.clientX,e.clientY));

  // تموّج الأزرار
  document.querySelectorAll('.btn').forEach(b=>{
    b.addEventListener('pointerdown',e=>{
      const r=b.getBoundingClientRect(), s=Math.max(r.width,r.height)*2;
      const d=document.createElement('span');d.className='rip';
      d.style.width=d.style.height=s+'px';
      d.style.left=(e.clientX-r.left-s/2)+'px';d.style.top=(e.clientY-r.top-s/2)+'px';
      b.appendChild(d);setTimeout(()=>d.remove(),600);
    });
  });

  // ضبط الحجم ليملأ الشاشة بدون تمرير
  const fitEl=document.querySelector('.wrap');
  function fit(){
    const avail=window.innerHeight-24;
    let z=1;
    for(let i=0;i<4;i++){
      fitEl.style.zoom=z;
      const h=fitEl.getBoundingClientRect().height;
      z=Math.max(.6,Math.min(1.3,z*avail/h));
    }
    fitEl.style.zoom=z;
  }
  window.addEventListener('load',()=>{fit();setTimeout(fit,150)});
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',()=>setTimeout(fit,200));
  fit();

  // اتصال وواتساب فوري
  function go(url){
    try{ window.top.location.href=url; }catch(e){ window.location.href=url; }
  }
  document.getElementById('callBtn').addEventListener('click',e=>{
    e.preventDefault();
    go('tel:07825828747');
  });
  document.getElementById('waBtn').addEventListener('click',e=>{
    e.preventDefault();
    go('https://wa.me/qr/O5BP6GYJUJ5QF1');
  });
</script>
</body>
</html>
